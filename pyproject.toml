[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "remote-file-transfer-kit"
version = "0.1.0"
description = "One Python API for FTP, FTPS, and SFTP file transfers."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Your Name"}]
dependencies = [
  "paramiko>=3.4",
  "typing-extensions>=4.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-paramiko>=4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/remote_transfer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
